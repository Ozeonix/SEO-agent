[project]
name = "seo-agent"
version = "0.1.0"
description = "Autonomous SEO & Ads Optimization Agent"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14.0",
  "apscheduler>=3.10.4",
  "pydantic-settings>=2.6.1",
  "cryptography>=44.0.0",
  "langchain-core>=0.3.15",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
